name: Dorey regression

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
